<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Medical Shield/Badge Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Glow Effect -->
  <circle cx="32" cy="32" r="24" fill="#2dd4bf" opacity="0.2" />

  <!-- Medical Cross / Heartbeat Waveform -->
  <path
    d="M12 33h10l4-9 8 18 6-12 4 6h8"
    stroke="#ffffff"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Medical Cross Badge in Top Right -->
  <rect x="42" y="10" width="12" height="4" rx="2" fill="#34d399" />
  <rect x="46" y="6" width="4" height="12" rx="2" fill="#34d399" />

  <!-- Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d9488" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
  </defs>
</svg>
